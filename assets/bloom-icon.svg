    <g transform="rotate(240)"><path d="M0 16 C-94 -38 -112 -155 -54 -245 C-27 -287 27 -287 54 -245 C112 -155 94 -38 0 16Z"/></g>
    <g transform="rotate(300)"><path d="M0 16 C-94 -38 -112 -155 -54 -245 C-27 -287 27 -287 54 -245 C112 -155 94 -38 0 16Z"/></g>
